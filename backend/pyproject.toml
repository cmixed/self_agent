[project]
name = "self-agent-backend"
version = "0.1.0"
description = "基于 RAG 的个人任务型智能体 - 后端（FastAPI + LangGraph）"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "httpx[socks]>=0.28",
    "langgraph>=1.2.12",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    # 直接声明 torch 以便通过下面的 pytorch-cpu 源安装 CPU-only 版本
    # （uv 的 tool.uv.sources 只对直接依赖生效）。
    "torch>=2.4",
    "pypdf>=5.0",
    "python-multipart>=0.0.20",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 本项目不使用 GPU，PyTorch 走 CPU-only 源，避免下载 CUDA/triton 的巨大依赖。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入通过参数默认值表达，不属于 B008 的问题场景
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not smoke"'
markers = [
    "smoke: 需要真实 DeepSeek API Key 的冒烟测试（默认跳过）",
]
