# 容器内的前端入口：静态托管 + /api 反向代理。
#
# 本地开发不加载本文件（Vite dev server 自己代理 /api），
# 因此这里的配置只影响容器运行，不改变 ./run.sh 的行为。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 知识库导入上限 100MB、完整备份上限 300MB（后端另有同样的限制）。
    # nginx 默认只有 1MB，不调大会直接返回 413，请求根本到不了 FastAPI。
    client_max_body_size 300m;
    client_body_timeout 300s;

    # 静态资源压缩；不要压缩 text/event-stream（SSE 必须逐条即时到达）。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 后端 API + SSE。
    # proxy_buffering off 是 SSE 的关键：否则 nginx 会攒满缓冲区才下发，
    # 前端看到的是「任务卡住」，而不是逐步进度。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 才能保持长连接（SSE 依赖它）。
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        # 长文任务可能持续很久，SSE 不能按默认 60s 断开。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    # Vite 产物文件名带内容 hash，可长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端没有 URL 路由（导航是内存状态），保留 SPA fallback 以便刷新不 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，避免发版后仍加载旧资源清单。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
