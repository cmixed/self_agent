name: Quality

# 后端质量门禁：ruff（lint）+ pyright（类型）+ pytest（单元/集成，不依赖真实 API）。
#
# 类型检查是这次补上的：此前只有 VS Code 里的 Pylance 会报，CI 不拦，
# 于是 `app/core/agent_graph.py` 的节点签名问题长期没人发现。
# 规则与 Pylance 一致（同一引擎），配置见 backend/pyrightconfig.json。
#
# 只跑后端：前端检查（vp check / npm test）留给前端自己的改动，避免 PR 变慢。

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # v5 起改用 Node 24；v4 会在 runner 上触发 Node 20 弃用告警。
      - uses: actions/checkout@v5

      # 缓存键绑定 backend/uv.lock；torch 是 CPU 轮子（uv.lock 里固定走
      # download.pytorch.org/whl/cpu），不会被换成 CUDA 版本。
      #
      # 必须固定 python-version：pyproject 的 requires-python 是 ">=3.14"，
      # 不锁定的话 uv 会装最新的 3.15，而 onnxruntime 1.30 只提供 cp314 轮子，
      # `uv sync` 会以 "doesn't have a source distribution or wheel for the
      # current platform" 失败。锁到 3.14 后 UV_PYTHON 贯穿后续所有步骤。
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev

      # ruff check 只做 lint，不覆盖排版；缺了这一步，format 漂移会一直累积
      # （2026-11 一次性清掉过 18 处，属于本可避免的返工）。
      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      # pyproject 里 addopts = -m 'not smoke'，真实 API 冒烟测试默认跳过。
      - name: Test (pytest)
        run: uv run pytest -q
